name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows
        run: dotnet publish src/GitSwap/GitSwap.csproj -c Release -r win-x64 --self-contained -o publish/windows

      - name: Zip Windows
        run: Compress-Archive -Path publish/windows/* -DestinationPath GitSwap-win-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GitSwap-win-x64.zip

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS x64
        run: dotnet publish src/GitSwap/GitSwap.csproj -c Release -r osx-x64 --self-contained -o publish/output

      - name: Create app bundle
        run: |
          mkdir -p publish/GitSwap.app/Contents/MacOS
          mkdir -p publish/GitSwap.app/Contents/Resources
          cp src/GitSwap/Platform/macOS/Info.plist publish/GitSwap.app/Contents/Info.plist
          cp src/GitSwap/Platform/macOS/icon.icns publish/GitSwap.app/Contents/Resources/icon.icns
          cp -r publish/output/* publish/GitSwap.app/Contents/MacOS/
          chmod +x publish/GitSwap.app/Contents/MacOS/GitSwap

      - name: Zip macOS x64
        run: cd publish && zip -r ../GitSwap-osx-x64.zip GitSwap.app

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: GitSwap-osx-x64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS arm64
        run: dotnet publish src/GitSwap/GitSwap.csproj -c Release -r osx-arm64 --self-contained -o publish/output

      - name: Create app bundle
        run: |
          mkdir -p publish/GitSwap.app/Contents/MacOS
          mkdir -p publish/GitSwap.app/Contents/Resources
          cp src/GitSwap/Platform/macOS/Info.plist publish/GitSwap.app/Contents/Info.plist
          cp src/GitSwap/Platform/macOS/icon.icns publish/GitSwap.app/Contents/Resources/icon.icns
          cp -r publish/output/* publish/GitSwap.app/Contents/MacOS/
          chmod +x publish/GitSwap.app/Contents/MacOS/GitSwap

      - name: Zip macOS arm64
        run: cd publish && zip -r ../GitSwap-osx-arm64.zip GitSwap.app

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: GitSwap-osx-arm64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux
        run: dotnet publish src/GitSwap/GitSwap.csproj -c Release -r linux-x64 --self-contained -o publish/linux

      - name: Zip Linux
        run: cd publish/linux && zip -r ../../GitSwap-linux-x64.zip *

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: GitSwap-linux-x64.zip

  create-release:
    needs: [build-windows, build-macos-x64, build-macos-arm64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows/GitSwap-win-x64.zip
            macos-x64/GitSwap-osx-x64.zip
            macos-arm64/GitSwap-osx-arm64.zip
            linux/GitSwap-linux-x64.zip
